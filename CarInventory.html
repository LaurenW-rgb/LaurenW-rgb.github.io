<!doctype html>
<html lang="en">
<head>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <title>Car Inventory</title>
    <script type="text/javascript" src="CarInventory.js" defer></script>
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="index.css" />
    <style>
        html * {
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<nav class="nav">
    <a href="index.html" class="menu-link">
        <div class="icon home-icon"></div>
        Home
    </a>
</nav>
<body class="body">
<div class="whole-page">
    <section class="input-and-output-section">
        <h1>Car Inventory</h1>
        <form onsubmit="calculateInventory(event)">
        <div class="div">
            <label class="label" for="drug">Drug:</label>
            <select
                class="standard-select"
                id="drug"
                name="drug"
                >
            </select>
            <div class="div">
                <label class="label" for="direction">Added or used</label>
                <select
                    class="standard-select"
                    id="direction"
                    name="direction"
                    >
                    <option value="added">Added</option>
                    <option value="used">Used</option>
                </select>
            </div>
            <div class="div">
                <label class="label" for="amount">Amount:</label>
                <div class="input-wrapper">
                    <input
                    class="input"
                    type="number"
                    step="any"
                    min="0"
                    id="amount"
                    name="amount"
                    />
                    <div class="input-suffix" aria-hidden="true">ml</div>
                </div>
            </div>
        </div>
            <button type="submit" class="button">
                Submit
            </button>
        </form>
        <section>
            <h2 id="newStock"></h2>
            <table class="results-table">
                <tr>
                    <td>Flunixin</td>
                    <td id=""></td>
                </tr>
                <tr>
                    <td>Detomidine</td>
                    <td id=""></td>
                </tr>
                <tr>
                    <td>Butorphanol</td>
                    <td id=""></td>
                </tr>
            </table>
        </section>
    </section>
</div>
</body>
</html>
